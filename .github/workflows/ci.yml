name: CI

# Every pull request and every push to main is validated identically. The
# runner checks out only convoke-space/public — that is the architectural
# invariant, enforced by the fact that nothing else is available here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out convoke-space/public
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Raw HTTP against the build that just completed. A browser test is not
      # enough here: a page that renders only after hydration looks correct in
      # one and is an empty document to a crawler.
      - name: Verify HTTP responses
        run: npm run verify:http
        env:
          NEXT_TELEMETRY_DISABLED: "1"
